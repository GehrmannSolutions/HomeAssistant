[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "ha-safe-mcp"
version = "0.11.0"
description = "Safety-first Home Assistant MCP server with local web UI, credential store, file manager and audit log"
license = "MIT"
license-files = ["LICENSE"]
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["mcp>=1.9,<2", "httpx>=0.27,<1", "python-dotenv>=1,<2", "websockets>=13,<17",
                "starlette>=0.40,<2", "uvicorn>=0.30,<1", "PyJWT[crypto]>=2.8,<3", "jsonschema>=4.20,<5",
                "cryptography>=42"]

[project.optional-dependencies]
test = ["pytest>=8,<10", "pytest-asyncio>=0.24,<2", "respx>=0.22,<1"]

[project.scripts]
ha-safe-mcp = "ha_safe_mcp.server:main"
ha-ollama-chat = "ha_safe_mcp.ollama_client:main"
ha-mcp-ui = "ha_safe_mcp.web:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
ha_safe_mcp = ["webui/*.html", "webui/*.js", "webui/*.css", "webui/*.svg"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
